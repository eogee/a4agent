  THESIS: 每个配置方案如柜台上的精品陈列——当前生效的一件被悄然点亮；拒绝「卡片网格 + 蓝按钮」的管理后台默认。
  OWN-WORLD: 象牙白地面上的无瑕白卡，发丝分隔线，深墨字；状态绿只点亮「当前生效」一处；柔和定向光、克制的圆角与软色徽章。
  STORY: 用户一打开就看见「当前生效」在顶栏常驻，配置像陈列在旗舰店柜台上的精品，点「切换」即把另一件请上展台，其余安静退让。
  FIRST VIEWPORT: 顶部白栏（a4agent 标题 + 当前生效状态 + 代理开关 + 新增配置深墨按钮）；下方细线 tab；主区为象牙白地面上的白色配置卡片，激活者带绿描边与淡绿光晕。
  FORM: 旗舰店柜台（grounded #6），seed ddbf58ae。
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
  -->
  <div class="app-header">
    <div class="app-title"><img class="app-mark" src="logo.png?v=20260929" alt="" aria-hidden="true">a4agent</div>
    <div class="status-bar" id="status-bar">
      <span class="status-label">当前生效：</span>
      <span id="status-text" class="status-text">加载中…</span>
    </div>
    <div class="header-actions layui-form">

      <a href="javascript:;" class="update-link" id="btn-check-update">检查更新</a>
      <button class="layui-btn layui-btn-normal" id="btn-add">新增配置</button>
    </div>
  </div>

        <li lay-id="mcp">MCP 管理</li>
        <li lay-id="llama">本地模型</li>
      </ul>
      <div class="layui-tab-content">
        <div class="layui-tab-item layui-show">
          <div id="card-grid" class="card-grid">
            <div class="empty-tip">加载中…</div>
          </div>
        </div>
        <div class="layui-tab-item">

          </div>
          <div id="provider-list" class="provider-list">
            <div class="empty-tip">加载中…</div>
          </div>
        </div>
        <div class="layui-tab-item">
          <div class="skills-header">
            <div class="seg-control" id="skills-scope-seg">
              <button class="seg-btn seg-active" data-view="global">全局视图</button>
              <button class="seg-btn" data-view="project">项目视图</button>
            </div>
            <div class="skills-header-actions">
              <a href="javascript:;" class="update-link" id="btn-skills-roots">项目根目录</a>
              <a href="javascript:;" class="update-link" id="btn-skills-migrations">迁移日志</a>
              <button class="layui-btn layui-btn-sm" id="btn-skills-trash">回收站</button>
              <button class="layui-btn layui-btn-sm" id="btn-skills-refresh">刷新</button>
            </div>
          </div>
          <div id="skills-content" class="card-grid">
            <div class="empty-tip">加载中…</div>
          </div>
        </div>
        <div class="layui-tab-item">
          <div class="skills-header">
            <div class="seg-control" id="mcp-scope-seg">
              <button class="seg-btn seg-active" data-view="global">全局视图</button>
              <button class="seg-btn" data-view="project">项目视图</button>
            </div>
            <div class="skills-header-actions">
              <a href="javascript:;" class="update-link" id="btn-mcp-migrations">迁移日志</a>
              <button class="layui-btn layui-btn-sm" id="btn-mcp-trash">回收站</button>
              <button class="layui-btn layui-btn-sm layui-btn-normal" id="btn-mcp-install">安装 MCP</button>
              <button class="layui-btn layui-btn-sm" id="btn-mcp-refresh">刷新</button>
            </div>
          </div>
          <div id="mcp-content" class="card-grid">
            <div class="empty-tip">加载中…</div>
          </div>
        </div>
        <div class="layui-tab-item">
          <div id="llama-content">
            <div class="empty-tip">加载中…</div>
          </div>
        </div>
      </div>
